  <text x="360" y="139" fill="#C8CDD3" font-family="Segoe UI, Arial, sans-serif" font-size="14">Diseñar con criterio</text>
  <text x="360" y="171" fill="#D7A476" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">ETHICAL HACKING  ·  ISO 27001</text>
