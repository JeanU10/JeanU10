<svg width="960" height="250" viewBox="0 0 960 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Áreas de trabajo de Jeanpierre Valenzuela</title>
  <desc id="desc">Tres tarjetas sobre desarrollo de software, ciberseguridad e inteligencia artificial y datos.</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#17191C"/>
      <stop offset="1" stop-color="#0E1012"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#8F5D39"/>
      <stop offset="0.5" stop-color="#D19A68"/>
      <stop offset="1" stop-color="#7A4A2E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(480 0) rotate(90) scale(250 480)">
      <stop stop-color="#C58A55" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C58A55" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="960" height="250" rx="18" fill="#0D0F11"/>
  <rect width="960" height="250" rx="18" fill="url(#glow)"/>
  <path d="M24 22H936" stroke="#5C402D" stroke-opacity="0.45"/>
  <path d="M24 228H936" stroke="#5C402D" stroke-opacity="0.45"/>

  <!-- Desarrollo de software -->
  <g filter="url(#shadow)">
    <rect x="24" y="34" width="288" height="182" rx="14" fill="url(#panel)" stroke="#493426"/>
    <rect x="24" y="34" width="288" height="3" rx="1.5" fill="url(#copper)"/>
  </g>
  <circle cx="68" cy="83" r="24" fill="#C58A55" fill-opacity="0.1" stroke="#A66E45"/>
  <path d="M61 76L53 83L61 90M75 76L83 83L75 90M71 70L65 96" stroke="#D7A476" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
