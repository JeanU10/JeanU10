  <text x="727" y="99" fill="#A7ADB5" font-family="Segoe UI, Arial, sans-serif" font-size="12">APRENDER · EXPLORAR</text>
  <text x="672" y="139" fill="#C8CDD3" font-family="Segoe UI, Arial, sans-serif" font-size="14">Convertir datos en soluciones</text>
