  <text x="103" y="99" fill="#F3F4F6" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">DE SOFTWARE</text>
  <text x="48" y="139" fill="#C8CDD3" font-family="Segoe UI, Arial, sans-serif" font-size="14">Construir bases sólidas</text>
  <text x="48" y="171" fill="#D7A476" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">JAVA  ·  PYTHON  ·  BACKEND</text>
  <path d="M48 190H288" stroke="#3B3028"/>
  <circle cx="51" cy="202" r="2" fill="#C58A55"/>
  <path d="M60 202H113" stroke="#6E4A34" stroke-linecap="round"/>

