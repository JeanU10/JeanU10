<svg width="960" height="270" viewBox="0 0 960 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Sobre Jean Pierre Valenzuela</title>
  <desc id="desc">Presentación profesional de Jean Pierre Valenzuela, estudiante de Ingeniería Informática interesado en desarrollo de software, seguridad, inteligencia artificial y datos.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="960" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17191C"/>
      <stop offset="0.55" stop-color="#111315"/>
      <stop offset="1" stop-color="#0D0F11"/>
    </linearGradient>
    <linearGradient id="accent" x1="28" y1="0" x2="932" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7A4A2E"/>
      <stop offset="0.5" stop-color="#D19A68"/>
      <stop offset="1" stop-color="#6A402A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(245 135) rotate(90) scale(230 330)">
      <stop stop-color="#C58A55" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#C58A55" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="960" height="270" rx="18" fill="url(#surface)"/>
  <rect width="960" height="270" rx="18" fill="url(#glow)"/>
  <rect x="1" y="1" width="958" height="268" rx="17" stroke="#493426" stroke-opacity="0.8"/>
  <path d="M28 24H932" stroke="url(#accent)" stroke-width="2"/>

  <text x="52" y="61" fill="#D19A68" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5">PERFIL / 01</text>
  <text x="52" y="108" fill="#F4F5F6" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="750" letter-spacing="0.2">APRENDO</text>
  <text x="52" y="144" fill="#F4F5F6" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="750" letter-spacing="0.2">CONSTRUYENDO</text>
  <text x="52" y="181" fill="#D19A68" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0.7">SOLUCIONES CLARAS,</text>
  <text x="52" y="211" fill="#D19A68" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" letter-spacing="0.7">ÚTILES Y CONFIABLES.</text>
  <path d="M52 231H340" stroke="#5D402E"/>
  <circle cx="55" cy="245" r="2.5" fill="#C58A55"/>
  <path d="M66 245H126" stroke="#6E4A34" stroke-linecap="round"/>

  <path d="M405 49V221" stroke="#3D3028"/>

  <text x="445" y="70" fill="#9A7A63" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.7">PRESENTACIÓN</text>
  <text x="445" y="99" fill="#F0F2F4" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="650">Soy estudiante de Ingeniería Informática, interesado en comprender</text>
  <text x="445" y="121" fill="#C8CDD3" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">el ciclo completo del software: desde una idea y su lógica hasta</text>
  <text x="445" y="143" fill="#C8CDD3" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">una solución funcional, segura y mantenible. Combino desarrollo,</text>
  <text x="445" y="165" fill="#C8CDD3" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">ciberseguridad, IA y datos para aprender construyendo proyectos.</text>

  <text x="445" y="194" fill="#9A7A63" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">BASE</text>
  <text x="445" y="215" fill="#E4E6E8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Java · Python · Backend</text>

  <text x="682" y="194" fill="#9A7A63" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">DIRECCIÓN</text>
  <text x="682" y="215" fill="#E4E6E8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">Seguridad · IA · Datos</text>

  <path d="M445 233H908" stroke="#3D3028"/>
  <text x="445" y="252" fill="#D19A68" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="650" letter-spacing="1.1">APRENDER CON INTENCIÓN · CONSTRUIR CON CRITERIO</text>

  <circle cx="907" cy="61" r="14" stroke="#6E4A34"/>
  <path d="M901 61H913M907 55V67" stroke="#D19A68" stroke-linecap="round"/>
</svg>
