  <g filter="url(#shadow)">
    <rect x="336" y="34" width="288" height="182" rx="14" fill="url(#panel)" stroke="#493426"/>
    <rect x="336" y="34" width="288" height="3" rx="1.5" fill="url(#copper)"/>
  </g>
  <circle cx="380" cy="83" r="24" fill="#C58A55" fill-opacity="0.1" stroke="#A66E45"/>
  <path d="M380 68L392 73V82C392 90 387 96 380 99C373 96 368 90 368 82V73L380 68Z" stroke="#D7A476" stroke-width="2" stroke-linejoin="round"/>
